# Checks on every push to `testing`: type-check, tests and the web package checks. No game files exist
# in CI; real-file tests skip. Pages is no longer deployed from here: the `github-pages` environment
# only accepts `v*` tags, and spec 006 moves the deploy to the release workflow (2026-09-26).
name: pages

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      H3_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test
      - run: yarn package --host web
      - run: yarn verify packages --host web --no-build
      - run: yarn verify hosts --host web --no-build
